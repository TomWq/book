[package]
name = "ai-novel-workbench"
version = "1.0.0"
description = "AI 网文写作助手桌面壳"
authors = ["AI 网文写作助手"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "ai-novel-workbench"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
