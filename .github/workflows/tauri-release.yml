name: Tauri Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  cleanup-draft-release:
    name: Clean draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete existing draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="app-v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            gh release delete "$TAG" --yes
          else
            echo "No existing draft release for $TAG."
          fi

  build-tauri:
    name: Build ${{ matrix.name }}
    needs: cleanup-draft-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            rustTarget: aarch64-apple-darwin
            prepareArgs: --mac --arm64
            tauriArgs: --target aarch64-apple-darwin
            artifactName: macos-arm64
            artifactPath: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*aarch64.dmg
            updaterArtifactName: macos-arm64-updater
            updaterArtifactPath: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: macOS x64
            platform: macos-latest
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            rustTarget: x86_64-apple-darwin
            prepareArgs: --mac --x64
            tauriArgs: --target x86_64-apple-darwin
            artifactName: macos-x64
            artifactPath: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*x64.dmg
            updaterArtifactName: macos-x64-updater
            updaterArtifactPath: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows x64
            platform: windows-latest
            rustTargets: x86_64-pc-windows-msvc
            rustTarget: x86_64-pc-windows-msvc
            prepareArgs: --win --x64
            tauriArgs: --target x86_64-pc-windows-msvc --bundles nsis
            artifactName: windows-x64
            artifactPath: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*x64-setup.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
            updaterArtifactName: ""
            updaterArtifactPath: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Tauri target resources
        run: node scripts/tauri-build.mjs --prepare-only ${{ matrix.prepareArgs }}

      - name: Build Tauri bundles
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.tauriArgs }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

      - name: Upload updater artifact
        if: ${{ matrix.updaterArtifactName != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.updaterArtifactName }}
          path: ${{ matrix.updaterArtifactPath }}
          if-no-files-found: error

  publish-release:
    name: Publish draft release
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Normalize release assets
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release-assets

          copy_one() {
            local search_dir="$1"
            local pattern="$2"
            local output="$3"
            local source
            source="$(find "$search_dir" -type f -name "$pattern" | sort | head -n 1)"
            if [ -z "$source" ]; then
              echo "Missing release asset: $search_dir / $pattern"
              find release-artifacts -maxdepth 4 -type f | sort
              exit 1
            fi
            cp "$source" "release-assets/$output"
          }

          copy_one "release-artifacts/windows-x64" "*x64-setup.exe" "AI-Novel-Workbench-Setup-${VERSION}-x64.exe"
          copy_one "release-artifacts/windows-x64" "*x64-setup.exe.sig" "AI-Novel-Workbench-Setup-${VERSION}-x64.exe.sig"
          copy_one "release-artifacts/macos-arm64" "*aarch64.dmg" "AI-Novel-Workbench-${VERSION}-arm64-mac.dmg"
          copy_one "release-artifacts/macos-arm64-updater" "*.app.tar.gz" "AI-Novel-Workbench-${VERSION}-arm64-mac.app.tar.gz"
          copy_one "release-artifacts/macos-arm64-updater" "*.app.tar.gz.sig" "AI-Novel-Workbench-${VERSION}-arm64-mac.app.tar.gz.sig"
          copy_one "release-artifacts/macos-x64" "*x64.dmg" "AI-Novel-Workbench-${VERSION}-x64-mac.dmg"
          copy_one "release-artifacts/macos-x64-updater" "*.app.tar.gz" "AI-Novel-Workbench-${VERSION}-x64-mac.app.tar.gz"
          copy_one "release-artifacts/macos-x64-updater" "*.app.tar.gz.sig" "AI-Novel-Workbench-${VERSION}-x64-mac.app.tar.gz.sig"

          printf 'Prepared release assets:\n'
          find release-assets -maxdepth 1 -type f | sort | sed 's#^# - #'

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="app-v${VERSION}"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            gh release delete "$TAG" --yes
          fi

          mapfile -d '' RELEASE_ASSETS < <(find release-assets -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" -o -name "*.exe" -o -name "*.sig" \) \
            -print0 | sort -z)

          if [ "${#RELEASE_ASSETS[@]}" -eq 0 ]; then
            echo "No release assets found in release-assets."
            find release-assets -maxdepth 3 -print
            exit 1
          fi

          printf 'Uploading release assets:\n'
          printf ' - %s\n' "${RELEASE_ASSETS[@]}"

          gh release create "$TAG" "${RELEASE_ASSETS[@]}" \
            --draft \
            --title "AI 网文写作助手 v${VERSION}" \
            --notes "自动构建的桌面端安装包，请在 Assets 中下载对应系统版本。"
