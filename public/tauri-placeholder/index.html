<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>墨澜 · AI 网文写作助手</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f6f9ff;
      }

      body {
        display: grid;
        place-items: center;
        position: relative;
        background:
          radial-gradient(circle at 64% 34%, rgba(23, 105, 255, 0.14), transparent 31%),
          linear-gradient(180deg, #ffffff 0%, #f6f9ff 48%, #ffffff 100%);
        color: #111318;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        user-select: none;
        transform-origin: center;
        transition:
          opacity 520ms linear,
          transform 520ms linear,
          filter 520ms linear;
      }

      body.is-leaving {
        opacity: 0;
        filter: blur(1px) saturate(0.98);
      }

      body::before {
        content: "";
        position: absolute;
        inset: -12%;
        pointer-events: none;
        background:
          radial-gradient(circle at 24% 70%, rgba(23, 105, 255, 0.12), transparent 28%),
          radial-gradient(circle at 76% 28%, rgba(31, 198, 166, 0.12), transparent 30%),
          radial-gradient(circle at 54% 48%, rgba(255, 255, 255, 0.9), transparent 34%);
        filter: blur(24px);
        opacity: 0.92;
      }

      body::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 26% 74%, rgba(255, 255, 255, 0.62), transparent 28%),
          repeating-radial-gradient(circle at 0 0, rgba(255, 255, 255, 0.36) 0 1px, transparent 1px 4px),
          repeating-linear-gradient(90deg, rgba(19, 26, 38, 0.035) 0 1px, transparent 1px 118px),
          repeating-linear-gradient(0deg, rgba(19, 26, 38, 0.022) 0 1px, transparent 1px 88px),
          linear-gradient(180deg, rgba(255, 255, 255, 0.58), rgba(246, 249, 255, 0.82));
        opacity: 0.76;
        backdrop-filter: blur(10px) saturate(1.08);
      }

      .stage {
        width: min(960px, calc(100vw - 72px));
        display: grid;
        grid-template-columns: minmax(280px, 0.9fr) minmax(320px, 0.72fr);
        align-items: center;
        gap: 72px;
        position: relative;
        z-index: 1;
      }

      .ambient {
        display: grid;
        gap: 22px;
        color: #111318;
      }

      .brand-line {
        color: #1769ff;
        font-size: 13px;
        font-weight: 900;
        line-height: 1;
      }

      .ambient h2 {
        max-width: 13ch;
        margin: 0;
        color: #111318;
        font-size: 32px;
        line-height: 1.22;
        letter-spacing: 0;
      }

      .ambient p {
        max-width: 35ch;
        margin: 0;
        color: #5e6675;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.82;
      }

      .status-list {
        display: grid;
        gap: 10px;
        margin-top: 4px;
      }

      .status-list span {
        --step-delay: 0ms;
        display: flex;
        align-items: center;
        gap: 9px;
        opacity: 0.28;
        transform: translateY(8px);
        color: #687386;
        font-size: 13px;
        font-weight: 780;
        animation: status-step 4.2s ease-in-out infinite;
        animation-delay: var(--step-delay);
      }

      .status-list span::before {
        content: "";
        width: 6px;
        height: 6px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #b7c4d8;
        box-shadow: 0 0 0 0 rgba(23, 105, 255, 0);
        animation: status-dot 4.2s ease-in-out infinite;
        animation-delay: var(--step-delay);
      }

      .status-list span:nth-child(1) {
        --step-delay: 0ms;
      }

      .status-list span:nth-child(2) {
        --step-delay: 760ms;
      }

      .status-list span:nth-child(3) {
        --step-delay: 1520ms;
      }

      .shell {
        width: min(390px, 100%);
        min-height: 292px;
        display: grid;
        place-items: center;
        align-content: center;
        justify-self: end;
        gap: 16px;
        overflow: hidden;
        position: relative;
        z-index: 1;
        border: 1px solid rgba(19, 26, 38, 0.1);
        border-radius: 18px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(247, 250, 255, 0.84)),
          rgba(255, 255, 255, 0.86);
        box-shadow:
          0 30px 80px rgba(19, 26, 38, 0.12),
          0 1px 0 rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(18px) saturate(1.08);
        transition:
          opacity 500ms linear,
          transform 500ms linear;
      }

      body.is-leaving .shell {
        opacity: 0;
        transform: translateY(4px) scale(0.992);
      }

      .shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 72% 20%, rgba(23, 105, 255, 0.12), transparent 24%),
          repeating-linear-gradient(90deg, rgba(19, 26, 38, 0.032) 0 1px, transparent 1px 82px);
        opacity: 0.72;
      }

      .halo {
        width: 148px;
        height: 148px;
        position: absolute;
        border-radius: 999px;
        background: rgba(23, 105, 255, 0.16);
        filter: blur(22px);
        animation: pulse 2.4s ease-in-out infinite;
      }

      .mark {
        width: 76px;
        height: 76px;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        background: #1769ff;
        box-shadow:
          0 18px 42px rgba(23, 105, 255, 0.24),
          0 1px 0 rgba(255, 255, 255, 0.72) inset;
        color: #ffffff;
        font-size: 34px;
        font-weight: 900;
        animation: float 2.8s ease-in-out infinite;
      }

      .mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      h1 {
        position: relative;
        margin: 4px 0 0;
        color: #111318;
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      p,
      small {
        position: relative;
        margin: 0;
        color: #5e6675;
        font-size: 13px;
        font-weight: 700;
      }

      small {
        max-width: 310px;
        text-align: center;
        line-height: 1.7;
        color: #7a8494;
      }

      .loader {
        width: 170px;
        height: 4px;
        overflow: hidden;
        position: relative;
        border-radius: 999px;
        background: rgba(23, 105, 255, 0.12);
      }

      .loader::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 44%;
        border-radius: inherit;
        background: linear-gradient(90deg, #1769ff, #1fc6a6);
        animation: loading 1.18s ease-in-out infinite;
      }

      .error {
        padding: 42px;
        text-align: center;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.92); }
        50% { opacity: 0.9; transform: scale(1.06); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @keyframes loading {
        0% { transform: translateX(-105%); }
        52% { transform: translateX(82%); }
        100% { transform: translateX(235%); }
      }

      @keyframes status-step {
        0% { opacity: 0.24; transform: translateY(8px); color: #8a94a6; }
        14% { opacity: 1; transform: translateY(0); color: #344155; }
        52% { opacity: 1; transform: translateY(0); color: #344155; }
        78% { opacity: 0.62; transform: translateY(0); color: #687386; }
        100% { opacity: 0.24; transform: translateY(8px); color: #8a94a6; }
      }

      @keyframes status-dot {
        0% {
          background: #b7c4d8;
          box-shadow: 0 0 0 0 rgba(23, 105, 255, 0);
          transform: scale(0.86);
        }
        14% {
          background: #1769ff;
          box-shadow: 0 0 0 5px rgba(23, 105, 255, 0.1);
          transform: scale(1);
        }
        52% {
          background: #1769ff;
          box-shadow: 0 0 0 5px rgba(23, 105, 255, 0.08);
          transform: scale(1);
        }
        78% {
          background: #1fc6a6;
          box-shadow: 0 0 0 0 rgba(31, 198, 166, 0);
          transform: scale(0.92);
        }
        100% {
          background: #b7c4d8;
          box-shadow: 0 0 0 0 rgba(23, 105, 255, 0);
          transform: scale(0.86);
        }
      }

      @media (max-width: 820px) {
        .stage {
          width: min(430px, calc(100vw - 44px));
          grid-template-columns: 1fr;
          gap: 22px;
        }

        .ambient {
          text-align: center;
          justify-items: center;
        }

        .ambient h2 {
          max-width: 14ch;
          font-size: 30px;
        }

        .status-list {
          display: none;
        }

        .shell {
          justify-self: center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          transition-duration: 1ms !important;
        }

        .status-list span {
          opacity: 1;
          transform: none;
          color: #344155;
        }

        .status-list span::before {
          background: #1769ff;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-live="polite">
      <section class="ambient" aria-label="墨澜启动说明">
        <span class="brand-line">墨澜 · AI 网文写作助手</span>
        <h2>把长篇写作项目安静地准备好。</h2>
        <p>正在载入作品资料、模板和创作状态，稍后进入你的工作台。</p>
        <div class="status-list" aria-hidden="true">
          <span>整理本地项目资料</span>
          <span>准备章节与人物状态</span>
          <span>连接创作工作台</span>
        </div>
      </section>

      <section class="shell" aria-label="启动进度">
        <div class="halo"></div>
        <div class="mark"><img src="app-icon.png" alt="" /></div>
        <h1>墨澜</h1>
        <p>正在准备创作工作台</p>
        <div class="loader" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
